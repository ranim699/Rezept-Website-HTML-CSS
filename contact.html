<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Recipe Corner or share your own recipe.">
  <title>Recipe Corner – Contact</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Recipe Corner</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav">Menu</button>
      <nav class="main-nav" id="main-nav" aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="recipes.html">Recipes</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="section">
    <div class="container">
      <h1 class="section-title">Contact us</h1>
      <p class="section-title">Questions, feedback or a recipe you would like to share? Write to us.</p>

      <!-- novalidate: we check the fields ourselves in js/main.js -->
      <form class="form" id="contact-form" novalidate>
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" aria-describedby="name-error" required>
          <span class="error-text" id="name-error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" aria-describedby="email-error" required>
          <span class="error-text" id="email-error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="topic">Topic</label>
          <select id="topic" name="topic">
            <option>General question</option>
            <option>Share a recipe</option>
            <option>Feedback</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" aria-describedby="message-error" required></textarea>
          <span class="error-text" id="message-error" aria-live="polite"></span>
        </div>

        <button class="btn" type="submit">Send message</button>
        <p class="success-message" id="success-message" role="status" hidden></p>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Recipe Corner</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
